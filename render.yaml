# render.yaml — Render "Blueprint" deployment file.
# You can either click "New +" > "Blueprint" on Render and point it at
# this repo, OR just create the web service manually in the dashboard
# and ignore this file (both are explained in deploy-to-render.txt).
services:
  - type: web
    name: upskill10x
    runtime: node
    plan: free                     # change to "starter" once you add a persistent disk
    buildCommand: npm install
    startCommand: npm run db:init && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/upskill10x.db   # if you attach a disk, point this at the mount path instead, e.g. /var/data/upskill10x.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Upskill10x Admin
      - key: FULL_PRICE
        value: 9999
      - key: COUPON_PRICE
        value: 999
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
    # Uncomment the block below once you upgrade to a paid plan and want
    # your SQLite data to survive redeploys/restarts:
    # disk:
    #   name: upskill10x-data
    #   mountPath: /var/data
    #   sizeGB: 1
