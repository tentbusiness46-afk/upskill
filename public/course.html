<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Course — Upskill10x</title>
<meta name="theme-color" content="#0056d2">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
.c-hero{background:linear-gradient(120deg,#0b1730 0%,var(--blue-900) 55%,var(--blue-800) 100%);color:#fff;padding:40px 0 44px}
.c-hero .wrap{display:grid;grid-template-columns:1fr 370px;gap:40px}
.crumbs{display:flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;color:var(--blue-200);margin-bottom:16px;flex-wrap:wrap}
.crumbs a:hover{color:#fff}
.c-hero h1{font-size:clamp(28px,4vw,40px);margin-bottom:12px}
.c-hero .lead{font-size:17px;color:#d5e1f5;margin-bottom:18px;max-width:680px}
.c-facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:#d5e1f5}
.c-facts span{display:inline-flex;align-items:center;gap:6px}
.c-facts .icon{width:16px;height:16px;color:var(--blue-200)}
.by{margin-top:16px;font-size:14px;color:#d5e1f5}
.by b{color:#fff}
.c-body .wrap{display:grid;grid-template-columns:1fr 370px;gap:40px}
.c-main{padding:36px 0 60px;min-width:0}

/* Purchase card (sticky, overlaps the hero on desktop) */
.buy-col{position:relative}
.buy-card{position:sticky;top:88px;margin-top:-260px;background:#fff;border-radius:20px;box-shadow:var(--shadow-3);border:1px solid var(--line-2);overflow:hidden;z-index:5}
.buy-thumb{position:relative;border-radius:0;aspect-ratio:16/9}
.buy-thumb .thumb{border-radius:0;height:100%}
.buy-thumb.has-pv .thumb-art svg{display:none}
.preview-btn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-weight:800;font-size:15px;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.55));z-index:3}
.preview-btn i{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.preview-btn i svg{width:22px;height:22px;fill:var(--ink);margin-left:3px}
.buy-in{padding:20px 22px 22px}
.buy-in .price{font-size:32px;letter-spacing:-.03em}
.buy-in .mrp{font-size:16px}
.buy-in .btn{margin-top:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted-2);font-size:12px;font-weight:700;margin:16px 0 12px}
.or::before,.or::after{content:'';flex:1;height:1px;background:var(--line-2)}
.upsell{border:1.5px solid var(--line);background:var(--blue-50);border-radius:14px;padding:14px}
.upsell b{font-size:14.5px}
.upsell p{font-size:13px;color:var(--ink-2);margin:3px 0 10px}
.includes{list-style:none;margin-top:16px;display:flex;flex-direction:column;gap:9px;font-size:13.5px;color:var(--ink-2)}
.includes li{display:flex;gap:9px;align-items:center}
.includes .icon{width:16px;height:16px;color:var(--blue-700)}
.guarantee{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px}

.box{border:1px solid var(--line-2);border-radius:18px;padding:22px 24px;margin-bottom:30px}
.box h2,.c-main h2{font-size:22px;margin-bottom:16px}
.learn{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;list-style:none}
.learn li{display:flex;gap:10px;font-size:14.5px;color:var(--ink-2)}
.learn .icon{color:var(--green);margin-top:2px}
.content-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.content-head span{font-size:14px;color:var(--muted)}
.syllabus{border:1px solid var(--line-2);border-radius:18px;overflow:hidden;margin-bottom:34px}
.sec{border-bottom:1px solid var(--line-2)}
.sec:last-child{border-bottom:none}
.sec-h{width:100%;display:flex;align-items:center;gap:12px;padding:17px 20px;text-align:left;background:var(--bg-2)}
.sec-h b{flex:1;font-size:15.5px}
.sec-h small{font-size:13px;color:var(--muted);white-space:nowrap}
.sec-h .chev{transition:transform .25s var(--ease);color:var(--blue-700)}
.sec.open .sec-h .chev{transform:rotate(180deg)}
.sec-b{max-height:0;overflow:hidden;transition:max-height .3s var(--ease)}
.lec{display:flex;align-items:center;gap:14px;padding:13px 20px 13px 24px;font-size:14.5px;color:var(--ink-2)}
.lec .play{width:24px;height:24px;color:var(--blue-700);flex-shrink:0}
.lec .t{flex:1;min-width:0}
.lec .pv{color:var(--blue-700);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.lec .d{color:var(--muted);font-size:13px;min-width:44px;text-align:right}
.lec .lock{width:18px;height:18px;color:var(--blue-600)}
.desc{font-size:15px;color:var(--ink-2);white-space:pre-line;margin-bottom:34px}
.bundle-banner{border-radius:20px;background:linear-gradient(120deg,var(--orange-600),var(--orange-400));color:#fff;padding:24px;display:flex;align-items:center;gap:20px;margin-bottom:38px;flex-wrap:wrap}
.bundle-banner div{flex:1;min-width:220px}
.bundle-banner h3{font-size:20px;margin-bottom:4px}
.bundle-banner p{opacity:.92;font-size:14px}
.bundle-banner .btn{background:#fff;color:var(--orange-600)}
.more{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.notfound{text-align:center;padding:100px 20px}

@media (max-width:980px){
  .c-hero .wrap,.c-body .wrap{grid-template-columns:1fr}
  .c-hero .hero-spacer{display:none}
  .buy-col{order:-1}
  .buy-card{position:relative;top:0;margin-top:-20px;box-shadow:var(--shadow-2)}
  .c-main{padding-top:24px}
  .more{grid-template-columns:1fr 1fr}
}
@media (max-width:600px){
  .learn{grid-template-columns:1fr}
  .more{grid-template-columns:1fr}
  .box{padding:18px}
  .lec{padding-left:18px;padding-right:16px}
  .lec .d{display:none}
  body{padding-bottom:70px}
}
</style>
</head>
<body>
<div id="chrome-top"></div>

<main id="page">
  <div class="c-hero"><div class="wrap"><div><div class="skeleton" style="height:28px;width:200px;margin-bottom:16px;opacity:.2"></div><div class="skeleton" style="height:44px;width:80%;opacity:.2"></div></div></div></div>
</main>

<div id="chrome-footer"></div>

<div class="buy-bar" id="buyBar">
  <div class="wrap">
    <div class="bb-text"><span id="bbLabel"></span><div class="bb-price" id="bbPrice"></div></div>
    <a href="#" class="btn btn-yellow" id="bbBtn">Buy now</a>
  </div>
</div>

<div class="modal-bg" id="previewModal">
  <div class="modal-box">
    <div class="modal-head"><h3 id="pvTitle">Preview</h3><button class="x-btn" id="pvClose" aria-label="Close"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="player"><video id="pvVideo" controls playsinline controlsList="nodownload" oncontextmenu="return false"></video></div>
    <div style="padding:16px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:200px;font-size:14px;color:var(--muted)" id="pvNote">Enjoying it? Buy the course to unlock every lesson.</div>
      <a href="#" class="btn btn-primary" id="pvBuy">Buy this course</a>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="/assets/site.js"></script>
<script src="/assets/chrome.js"></script>
<script>
const { esc, rupees, thumb, duration, clock, offPct } = U;
const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean)[1] || '');
const ICON = {
  check: '<svg class="icon" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>',
  play: '<svg class="play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="m10 8.5 5 3.5-5 3.5Z" fill="currentColor"/></svg>',
  lock: '<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  chev: '<svg class="icon chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>'
};

async function load() {
  let data;
  try { data = await U.api('/courses/' + encodeURIComponent(slug)); }
  catch (e) {
    document.getElementById('page').innerHTML = `<div class="notfound"><h1 style="font-size:28px;margin-bottom:10px">Course not found</h1><p style="color:var(--muted);margin-bottom:20px">It may have been renamed or unpublished.</p><a class="btn btn-primary" href="/courses">Browse all courses</a></div>`;
    return;
  }
  const { course: c, curriculum, bundle, course_count } = data;
  document.title = `${c.title} — Upskill10x`;
  const buyUrl = `/pay?item=course&course=${encodeURIComponent(c.slug)}`;
  const off = offPct(c.price, c.mrp);
  const lessons = curriculum.reduce((n, m) => n + m.videos.length, 0);
  const firstPreview = curriculum.flatMap(m => m.videos).find(v => v.is_preview);

  document.getElementById('page').innerHTML = `
    <div class="c-hero">
      <div class="wrap">
        <div>
          <div class="crumbs"><a href="/courses">Courses</a><span>›</span><span>${esc(c.category || 'Course')}</span></div>
          <h1>${esc(c.title)}</h1>
          <p class="lead">${esc(c.subtitle || '')}</p>
          <div class="c-facts">
            <span><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>${curriculum.length} modules</span>
            <span><svg class="icon" viewBox="0 0 24 24"><path d="m10 8 6 4-6 4V8Z"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>${lessons} lessons</span>
            ${c.total_secs ? `<span><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${duration(c.total_secs)} total</span>` : ''}
            <span><svg class="icon" viewBox="0 0 24 24"><path d="M3 20h18M6 16V9M12 16V5M18 16v-4"/></svg>${esc(c.level || 'Beginner')}</span>
            <span><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>${esc(c.language || '')}</span>
          </div>
          <div class="by">Created by <b>Upskill10x</b> · Lifetime access · Certificate of completion</div>
        </div>
        <div class="hero-spacer"></div>
      </div>
    </div>

    <div class="c-body">
      <div class="wrap">
        <div class="c-main">
          ${c.outcomes.length ? `<div class="box"><h2>What you'll learn</h2><ul class="learn">${c.outcomes.map(o => `<li>${ICON.check}<span>${esc(o)}</span></li>`).join('')}</ul></div>` : ''}

          <div class="content-head">
            <h2 style="margin:0">Course content</h2>
            <span>${curriculum.length} modules · ${lessons} lessons${c.total_secs ? ' · ' + duration(c.total_secs) : ''} · <button class="btn-link" id="toggleAll">Expand all</button></span>
          </div>
          <div class="syllabus" id="syllabus">
            ${curriculum.map((m, i) => {
              const secs = m.videos.reduce((n, v) => n + (v.duration_secs || 0), 0);
              return `
              <div class="sec">
                <button class="sec-h">${ICON.chev}<b>${i + 1}. ${esc(m.title)}</b><small>${m.videos.length} lessons${secs ? ' · ' + duration(secs) : ''}</small></button>
                <div class="sec-b">
                  ${m.videos.map(v => `
                    <div class="lec">${ICON.play}<span class="t">${esc(v.title)}</span>
                      ${v.is_preview ? `<a href="#" class="pv" data-preview="${v.id}" data-title="${esc(v.title)}">Preview</a>` : ICON.lock}
                      <span class="d">${clock(v.duration_secs)}</span>
                    </div>`).join('') || '<div class="lec" style="color:var(--muted)">Lessons coming soon</div>'}
                </div>
              </div>`;
            }).join('') || '<div class="empty">The curriculum is being prepared.</div>'}
          </div>

          ${c.description ? `<h2>Description</h2><p class="desc">${esc(c.description)}</p>` : ''}

          ${course_count > 1 ? `
          <div class="bundle-banner">
            <div><h3>Get this + ${course_count - 1} more course${course_count > 2 ? 's' : ''}</h3><p>${esc(bundle.title)} — every course, including new ones, for ${rupees(bundle.price)} one-time.</p></div>
            <a href="/pay?item=bundle" class="btn">Get ${esc(bundle.title)}</a>
          </div>` : ''}

          <h2>More courses</h2>
          <div class="more" id="more"></div>
        </div>

        <aside class="buy-col">
          <div class="buy-card">
            <div class="buy-thumb ${firstPreview ? 'has-pv' : ''}"><div class="thumb">${thumb(c, { tag: false })}</div>
              ${firstPreview ? `<button class="preview-btn" data-preview="${firstPreview.id}" data-title="${esc(firstPreview.title)}"><i><svg viewBox="0 0 24 24"><path d="M7 4v16l13-8Z"/></svg></i>Preview this course</button>` : ''}
            </div>
            <div class="buy-in">
              <div class="price-row"><span class="price">${rupees(c.price)}</span>${c.mrp ? `<span class="mrp">${rupees(c.mrp)}</span>` : ''}${off ? `<span class="off">${off}% off</span>` : ''}</div>
              <a href="${buyUrl}" class="btn btn-primary btn-block btn-lg">Buy this course</a>
              ${course_count > 1 ? `
              <div class="or">OR</div>
              <div class="upsell">
                <b>${esc(bundle.title)} · ${rupees(bundle.price)}</b>${bundle.mrp ? ` <span class="mrp" style="font-size:13px">${rupees(bundle.mrp)}</span>` : ''}
                <p>All ${course_count} courses, plus every new one we launch.</p>
                <a href="/pay?item=bundle" class="btn btn-accent btn-block btn-sm">Get All-Access</a>
              </div>` : ''}
              <ul class="includes">
                <li><svg class="icon" viewBox="0 0 24 24"><path d="m10 8 6 4-6 4V8Z"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>${lessons} on-demand video lessons</li>
                <li><svg class="icon" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>Access on web and the mobile app</li>
                <li><svg class="icon" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M2 21c0-4 3.6-7 7-7s7 3 7 7"/></svg>Community &amp; jobs board</li>
                <li><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 8 5-3 5 3-1.5-8"/></svg>Certificate of completion</li>
              </ul>
              <div class="guarantee">48-hour money-back guarantee</div>
            </div>
          </div>
        </aside>
      </div>
    </div>`;

  // Accordion: first module open
  const secs = [...document.querySelectorAll('.sec')];
  const setOpen = (sec, open) => { sec.classList.toggle('open', open); const b = sec.querySelector('.sec-b'); b.style.maxHeight = open ? b.scrollHeight + 'px' : null; };
  secs.forEach((s, i) => { s.querySelector('.sec-h').addEventListener('click', () => setOpen(s, !s.classList.contains('open'))); if (i === 0) setOpen(s, true); });
  const ta = document.getElementById('toggleAll');
  if (ta) ta.addEventListener('click', () => { const all = secs.every(s => s.classList.contains('open')); secs.forEach(s => setOpen(s, !all)); ta.textContent = all ? 'Expand all' : 'Collapse all'; });

  document.querySelectorAll('[data-preview]').forEach(el => el.addEventListener('click', (e) => { e.preventDefault(); openPreview(el.dataset.preview, el.dataset.title, buyUrl); }));

  // Float the purchase card over the hero on desktop (hero height varies).
  const hero = document.querySelector('.c-hero');
  const placeCard = () => { const cardEl = document.querySelector('.buy-card'); cardEl.style.marginTop = innerWidth > 980 ? -(hero.offsetHeight - 32) + 'px' : ''; };
  placeCard(); addEventListener('resize', placeCard);

  // Sticky bottom bar
  document.getElementById('bbLabel').innerHTML = `Get <b>${esc(c.title)}</b>`;
  document.getElementById('bbPrice').innerHTML = `${rupees(c.price)}${c.mrp ? `<s>${rupees(c.mrp)}</s>` : ''}`;
  document.getElementById('bbBtn').href = buyUrl;
  const bar = document.getElementById('buyBar');
  const card = document.querySelector('.buy-card');
  const io = new IntersectionObserver(([e]) => bar.classList.toggle('show', !e.isIntersecting && e.boundingClientRect.top < 0), { threshold: 0 });
  io.observe(card);

  CATALOG.then(({ courses }) => {
    const others = courses.filter(x => x.id !== c.id).slice(0, 3);
    document.getElementById('more').innerHTML = others.map(o => `
      <a class="c-card" href="/course/${esc(o.slug)}">
        <div class="thumb">${thumb(o)}</div>
        <h3>${esc(o.title)}</h3>
        <div class="c-meta"><span>${o.lesson_count} lessons</span>${o.total_secs ? `<span>${duration(o.total_secs)}</span>` : ''}</div>
        <div class="price-row"><span class="price">${rupees(o.price)}</span>${o.mrp ? `<span class="mrp">${rupees(o.mrp)}</span>` : ''}</div>
      </a>`).join('') || '<p style="color:var(--muted)">More courses coming soon.</p>';
  });
}

/* ---------- Free preview player ---------- */
const modal = document.getElementById('previewModal');
const pvVideo = document.getElementById('pvVideo');
let destroyPlayer = null;
async function openPreview(id, title, buyUrl) {
  document.getElementById('pvTitle').textContent = title || 'Preview';
  document.getElementById('pvBuy').href = buyUrl;
  modal.classList.add('show');
  try {
    const v = await U.api('/preview/' + id);
    if (!v.hls_url) { document.getElementById('pvNote').textContent = 'This preview is being uploaded — check back soon.'; return; }
    destroyPlayer = U.playHls(pvVideo, v.hls_url);
    pvVideo.play().catch(() => {});
  } catch (e) { document.getElementById('pvNote').textContent = e.message; }
}
function closePreview() {
  modal.classList.remove('show');
  pvVideo.pause();
  if (destroyPlayer) { destroyPlayer(); destroyPlayer = null; }
}
document.getElementById('pvClose').addEventListener('click', closePreview);
modal.addEventListener('click', e => { if (e.target === modal) closePreview(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePreview(); });

load();
</script>
</body>
</html>
