<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upskill10x</title>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   UPSKILL10X — learning app. Mobile-first (this is what the Android app
   shows); on wide screens the bottom bar becomes a sidebar.
===================================================================== */
:root{
  --void:#ffffff; --bg-2:#f7f9fc; --bg-3:#eef1f8;
  --b900:#002c6b; --b700:#00419e; --b600:#0056d2; --b500:#1a6fe0; --b400:#5b96ea; --b-glow:#a8c8f5;
  --o600:#ea580c; --o500:#f97316; --o400:#fb923c; --o100:#fff1e6;
  --green:#16a34a; --green-50:#e9f8ef; --red:#dc2626;
  --ink:#1a1a1a; --silver:#4a4a4a; --muted:#6b6b6b; --muted-2:#9a9a9a;
  --line:rgba(0,86,210,0.16); --line-2:rgba(0,0,0,0.08);
  --ff:'Inter',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.16,.84,.44,1);
  --nav-h:72px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--ff);background:var(--void);color:var(--ink);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px)}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:inherit}
img{max-width:100%;display:block}
h1,h2,h3,h4{font-weight:700;letter-spacing:-0.01em}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.app{max-width:480px;margin:0 auto;position:relative;min-height:100vh}
.blob{position:fixed;border-radius:50%;filter:blur(70px);z-index:-1;pointer-events:none;animation:drift 9s ease-in-out infinite}
.blob1{width:280px;height:280px;background:var(--b600);opacity:.12;top:-80px;right:-60px}
.blob2{width:220px;height:220px;background:var(--o500);opacity:.07;bottom:120px;left:-70px;animation-delay:-4s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,-10px)}}

/* ---------- Header ---------- */
.top{padding:20px 20px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hi{display:flex;flex-direction:column;gap:1px;min-width:0}
.hi-eyebrow{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.hi b{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:9px}
.streak-chip{white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:800;color:var(--o600);background:var(--o100);padding:6px 10px;border-radius:99px}
.streak-chip.cold{color:var(--muted);background:var(--bg-3)}
.av{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--b600),var(--b400));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;transition:transform .3s var(--ease)}
.av:active{transform:scale(.92)}

main{padding:14px 20px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px))}
.view-enter{animation:panelSlide .4s var(--ease) both}
@keyframes panelSlide{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}

/* ---------- Cards (from the app prototype) ---------- */
.glass{background:rgba(255,255,255,.88);border:1px solid rgba(0,86,210,.28);border-radius:22px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden;animation:pop .5s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.glass.plain{border-color:var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.03em;padding:5px 11px;border-radius:99px;background:rgba(0,86,210,.1);color:var(--b600);margin-bottom:12px}
.glass h2{font-size:20px;margin-bottom:6px}
.glass p.s{font-size:13px;color:var(--muted);margin-bottom:16px}
.glow-bar{height:8px;background:rgba(15,23,42,.08);border-radius:99px;overflow:hidden;margin-bottom:8px}
.glow-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--b500),var(--b-glow));border-radius:99px;box-shadow:0 0 14px rgba(168,200,245,.7);width:0;transition:width 1s .2s var(--ease)}
.bar-lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted-2);margin-bottom:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:13.5px;padding:13px 20px;border-radius:13px;transition:.2s var(--ease);width:100%}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--b600);color:#fff;box-shadow:0 12px 30px -10px rgba(0,44,107,.45)}
.btn-accent{background:var(--o500);color:#fff;box-shadow:0 12px 30px -10px rgba(234,88,12,.5)}
.btn-ghost{background:rgba(15,23,42,.04);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--b400);background:rgba(0,86,210,.06)}
.btn-sm{padding:9px 14px;font-size:12.5px;border-radius:11px;width:auto}
.btn[disabled]{opacity:.55;pointer-events:none}
.row-btns{display:flex;gap:10px}

.stat-row{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;background:rgba(15,23,42,.03);border:1px solid var(--line-2);border-radius:16px;padding:14px 8px;text-align:center}
.stat .n{font-size:20px;font-weight:700}
.stat .l{font-size:10.5px;color:var(--muted-2);margin-top:2px}

.goal-row{display:flex;align-items:center;gap:16px}
.ring{flex-shrink:0}
.ring circle{fill:none}
.ring .bg{stroke:var(--line-2)}
.ring .fg{stroke:var(--b600);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset 1.1s .2s var(--ease)}
.goal-label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.goal-value{font-size:21px;font-weight:700;margin:2px 0}
.goal-value span{font-size:12.5px;color:var(--muted-2);font-weight:600}
.goal-sub{font-size:11.5px;color:var(--muted-2)}

.sec-title{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sec-title a{color:var(--b600);font-size:12.5px}

/* Promo slider */
.promo{margin-bottom:16px}
.promo-track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:20px}
.promo-track::-webkit-scrollbar{display:none}
.promo-slide{flex:0 0 100%;scroll-snap-align:center;border-radius:20px;padding:20px 20px 18px;position:relative;overflow:hidden;color:#fff;min-height:146px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.promo-slide::after{content:'';position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14)}
.promo-slide::before{content:'';position:absolute;right:30px;bottom:-50px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.09)}
.p-orange{background:linear-gradient(135deg,var(--o600),var(--o400))}
.p-blue{background:linear-gradient(135deg,var(--b700),var(--b500))}
.p-navy{background:linear-gradient(135deg,var(--b900),var(--b600))}
.p-mix{background:linear-gradient(135deg,var(--b600),var(--o500))}
.promo-tag{align-self:flex-start;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.22);padding:4px 9px;border-radius:99px;position:relative;z-index:1}
.promo-slide h3{font-size:17px;line-height:1.2;margin:10px 0 4px;position:relative;z-index:1}
.promo-slide p{font-size:12px;opacity:.92;position:relative;z-index:1;max-width:80%}
.promo-cta{align-self:flex-start;margin-top:12px;font-size:12px;font-weight:800;background:#fff;color:var(--b700);padding:7px 14px;border-radius:99px;position:relative;z-index:1}
.p-orange .promo-cta,.p-mix .promo-cta{color:var(--o600)}
.promo-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.promo-dot{width:6px;height:6px;border-radius:99px;background:var(--line-2);transition:.3s var(--ease)}
.promo-dot.active{width:18px;background:var(--o500)}

.mod-card{display:flex;align-items:center;gap:12px;background:rgba(15,23,42,.03);border:1px solid var(--line-2);border-radius:15px;padding:13px;margin-bottom:9px;animation:cardIn .4s var(--ease) both;cursor:pointer;transition:border-color .2s}
.mod-card:hover{border-color:var(--b400)}
.mod-card:active{transform:scale(.98)}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mod-card h4{font-size:13.5px}
.mod-card p{font-size:11px;color:var(--muted-2);margin-top:1px}
.mod-card .go{margin-left:auto;color:var(--muted-2)}

/* Course cards */
.seg{display:flex;background:var(--bg-3);border-radius:13px;padding:4px;margin-bottom:16px;position:relative}
.seg button{flex:1;padding:9px;border-radius:10px;font-weight:700;font-size:13px;color:var(--muted);position:relative;z-index:1}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc{background:rgba(15,23,42,.03);border:1px solid var(--line-2);border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s var(--ease);animation:cardIn .4s var(--ease) both;display:flex;flex-direction:column}
.cc:hover{border-color:var(--b400)}
.cc:active{transform:scale(.98)}
.cthumb{height:78px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cthumb svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.6;position:relative;z-index:1}
.cthumb::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.35))}
.cthumb .o1{position:absolute;right:-20px;top:-26px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.14)}
.ctag{position:absolute;top:7px;left:7px;font-size:8.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);padding:2px 7px;border-radius:99px;color:#fff;z-index:2}
.cowned{position:absolute;top:7px;right:7px;z-index:2;width:20px;height:20px;border-radius:50%;background:#fff;color:var(--green);display:flex;align-items:center;justify-content:center}
.cowned svg{width:12px;height:12px;stroke:var(--green);stroke-width:3}
.cbody{padding:10px 11px 12px;display:flex;flex-direction:column;flex:1}
.cbody h4{font-size:12.5px;font-weight:700;margin-bottom:4px;line-height:1.25}
.cmeta{font-size:9.5px;color:var(--muted-2);margin-bottom:9px}
.cfoot{margin-top:auto}
.cprog{display:flex;align-items:center;gap:6px}
.cprog .track{flex:1;height:5px;background:var(--line-2);border-radius:99px;overflow:hidden}
.cprog .track span{display:block;height:100%;background:linear-gradient(90deg,var(--b500),var(--b-glow));width:0;transition:width .8s var(--ease)}
.cprog .pct{font-size:9.5px;color:var(--muted-2)}
.cprice{display:flex;align-items:baseline;gap:5px}
.cprice b{font-size:14px}
.cprice s{font-size:10.5px;color:var(--muted-2)}
.h-scroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}
.h-scroll::-webkit-scrollbar{display:none}
.h-scroll .cc{flex:0 0 156px}

/* Course detail */
.back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;margin:4px 0 14px}
.back:hover{color:var(--b600)}
.back svg{width:14px;height:14px}
.banner{height:150px;border-radius:18px;display:flex;align-items:flex-end;padding:18px;position:relative;overflow:hidden;margin-bottom:16px}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner .big-ico{position:absolute;right:18px;top:18px;width:56px;height:56px;stroke:#fff;fill:none;stroke-width:1.4;opacity:.9;z-index:1}
.banner::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(5,10,25,.78))}
.banner-c{position:relative;z-index:2}
.banner h2{font-size:19px;color:#fff;line-height:1.2}
.dtag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(0,0,0,.4);color:#fff;padding:4px 9px;border-radius:99px;margin-bottom:8px}
.dmeta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.ddesc{font-size:13px;color:var(--silver);line-height:1.6;margin-bottom:18px}
.buybox{border:1.5px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px;background:linear-gradient(160deg,rgba(0,86,210,.06),#fff)}
.buybox .pr{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.buybox .pr b{font-size:24px;letter-spacing:-.02em}
.buybox .pr s{color:var(--muted-2)}
.buybox .off{font-size:11px;font-weight:800;color:var(--green);background:var(--green-50);padding:2px 7px;border-radius:6px}
.buybox .or{display:flex;align-items:center;gap:8px;color:var(--muted-2);font-size:11px;font-weight:700;margin:12px 0}
.buybox .or::before,.buybox .or::after{content:'';flex:1;height:1px;background:var(--line-2)}
.buybox small{display:block;text-align:center;color:var(--muted);font-size:11.5px;margin-top:8px}
.dm{border:1px solid var(--line-2);border-radius:14px;margin-bottom:10px;overflow:hidden;background:rgba(15,23,42,.03)}
.dm-head{display:flex;align-items:center;gap:9px;padding:13px 14px;cursor:pointer;user-select:none}
.dm-head h4{flex:1;font-size:14px;font-weight:700}
.mnum{width:22px;height:22px;border-radius:7px;background:rgba(0,86,210,.14);color:var(--b700);display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex-shrink:0}
.dm.done .mnum{background:var(--green);color:#fff}
.dm.locked .mnum{background:var(--line-2);color:var(--muted)}
.mstat{font-size:10.5px;font-weight:700;color:var(--muted-2);white-space:nowrap}
.chev{width:16px;height:16px;color:var(--muted-2);transition:transform .25s var(--ease)}
.dm.open .chev{transform:rotate(180deg)}
.dm-body{max-height:0;overflow:hidden;transition:max-height .3s var(--ease)}
.dm-inner{padding:0 12px 12px}
.vr{display:flex;align-items:center;gap:11px;padding:10px 12px;background:#fff;border:1px solid var(--line-2);border-radius:12px;margin-bottom:7px;cursor:pointer;transition:.15s}
.vr:hover{border-color:var(--b400)}
.vr .vp{width:28px;height:28px;border-radius:50%;background:rgba(0,86,210,.12);display:flex;align-items:center;justify-content:center;color:var(--b700);flex-shrink:0}
.vr .vp svg{width:11px;height:11px}
.vr.done .vp{background:var(--green);color:#fff}
.vr.locked{cursor:default;opacity:.7}
.vr.locked .vp{background:var(--line-2);color:var(--muted)}
.vr .vt{font-size:12.5px;flex:1;min-width:0;line-height:1.35}
.vr .vd{font-size:10.5px;color:var(--muted-2);white-space:nowrap}
.pv-chip{font-size:9.5px;font-weight:800;color:var(--o600);background:var(--o100);padding:3px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.vr.current{border-color:var(--b600);background:rgba(0,86,210,.05)}

/* Player */
.player-wrap{background:#000;border-radius:16px;overflow:hidden;aspect-ratio:16/9;margin-bottom:14px;position:relative}
.player-wrap video{width:100%;height:100%;display:block;background:#000}
.player-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:13px;text-align:center;padding:20px}
.wm{position:absolute;color:rgba(255,255,255,.28);font-size:11px;font-weight:600;pointer-events:none;transition:top 1.2s,left 1.2s;white-space:nowrap;z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.l-title{font-size:18px;margin-bottom:4px;line-height:1.3}
.l-sub{font-size:12px;color:var(--muted);margin-bottom:14px}
.l-desc{font-size:13px;color:var(--silver);line-height:1.6;margin:4px 0 16px}
.done-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--green);background:var(--green-50);padding:7px 12px;border-radius:99px}

/* Community */
.thread-card{display:flex;gap:11px;padding:13px;background:rgba(15,23,42,.03);border:1px solid var(--line-2);border-radius:14px;margin-bottom:9px;cursor:pointer;transition:.2s var(--ease);animation:cardIn .4s var(--ease) both}
.thread-card:hover{border-color:var(--b400)}
.thread-card h5{font-size:13px;font-weight:700;margin-bottom:3px}
.thread-card p{font-size:11px;color:var(--muted)}
.thread-card .ex{font-size:12px;color:var(--silver);margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.avatar{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--b600),var(--b400));display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0;color:#fff}
.avatar.o{background:linear-gradient(135deg,var(--o600),var(--o400))}
.avatar.t{background:linear-gradient(135deg,#0f766e,#14b8a6)}
.op{background:rgba(15,23,42,.03);border:1px solid var(--line-2);border-radius:16px;padding:16px;margin-bottom:16px}
.op-top{display:flex;align-items:center;gap:10px}
.op h2{font-size:16px;margin:12px 0 10px}
.op-meta{font-size:11px;color:var(--muted-2)}
.op-body{font-size:13px;color:var(--silver);line-height:1.6;white-space:pre-line}
.cmt-count{font-size:11.5px;color:var(--muted);margin:16px 0 10px;font-weight:600}
.cmt{display:flex;gap:10px;padding:8px 0}
.cmt-body{background:rgba(15,23,42,.03);border:1px solid var(--line-2);border-radius:11px;padding:10px 12px;flex:1}
.cmt-body .cn{font-size:11.5px;font-weight:700;margin-bottom:3px}
.cmt-body .ct{font-size:12.5px;color:var(--silver);line-height:1.5;white-space:pre-line}
.cmt-body .cd{font-size:10px;color:var(--muted-2);margin-top:4px}
.reply-box{display:flex;gap:8px;align-items:flex-end;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px}
.reply-box textarea{flex:1;border:none;outline:none;resize:none;padding:6px 8px;font-size:13px;max-height:140px;background:none}
.lock-card{text-align:center;padding:28px 22px}
.lock-card .li{font-size:34px;margin-bottom:8px}
.lock-card h3{font-size:17px;margin-bottom:6px}
.lock-card p{font-size:13px;color:var(--muted);margin-bottom:16px}

/* AI Coach (coming soon) */
.ai-glass{background:linear-gradient(155deg,rgba(0,86,210,.08),#fff)}
.ai-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ai-ico{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--b600),var(--b400));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ai-ico svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;animation:spark 3s linear infinite}
@keyframes spark{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.12)}}
.ai-glass h3{font-size:16px;color:var(--b700)}
.ai-glass p{font-size:12.5px;color:var(--silver);line-height:1.5}
.soon-chip{font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--o600);background:var(--o100);padding:4px 8px;border-radius:99px}
.ai-toggle{margin-left:auto;position:relative;width:40px;height:22px;border-radius:99px;background:var(--line-2);flex-shrink:0;opacity:.6;cursor:not-allowed}
.ai-toggle-thumb{position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.2)}

/* Jobs */
.search{display:flex;align-items:center;gap:9px;background:rgba(15,23,42,.03);border:1px solid var(--line-2);border-radius:14px;padding:12px 15px;margin-bottom:14px;transition:.2s var(--ease)}
.search:focus-within{border-color:var(--b400);background:rgba(0,86,210,.06)}
.search svg{width:15px;height:15px;color:var(--muted-2)}
.search input{background:none;border:none;outline:none;width:100%;font-size:13px}
.job{background:rgba(15,23,42,.03);border:1px solid var(--line-2);border-radius:15px;padding:14px;margin-bottom:9px;display:flex;gap:12px;animation:cardIn .4s var(--ease) both}
.job img{width:42px;height:42px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#fff}
.job h5{font-size:13.5px;font-weight:700}
.job .co{font-size:11.5px;color:var(--muted-2);margin:1px 0 7px}
.job .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pay-chip{font-size:10.5px;font-weight:700;color:var(--b700);background:rgba(0,86,210,.1);padding:4px 9px;border-radius:99px}
.job .jd{font-size:12px;color:var(--silver);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px}
.job .jf{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:10.5px;color:var(--muted-2)}

/* Account */
.acct-header{text-align:center;margin-bottom:20px;padding-top:6px}
.acct-avatar{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--b600),var(--b400));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;margin:0 auto 12px;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(0,86,210,.4)}50%{box-shadow:0 0 0 12px rgba(0,86,210,0)}}
.acct-header h2{font-size:19px}
.acct-sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.member-chip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11.5px;font-weight:800;padding:6px 12px;border-radius:99px;background:linear-gradient(135deg,var(--o600),var(--o400));color:#fff}
.heat-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.heat-head h3{font-size:16px}
.heat-head span{font-size:11px;color:var(--muted-2)}
.heat-months{display:flex;margin-bottom:6px}
.heat-months span{font-size:10.5px;color:var(--muted-2);font-weight:600}
.heat-grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.hc{width:100%;aspect-ratio:1;border-radius:3px;background:var(--line-2);animation:heatIn .35s var(--ease) both}
@keyframes heatIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.hc.future{background:transparent}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10.5px;color:var(--muted-2);margin-top:12px}
.heat-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.badge-row{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.badge-row::-webkit-scrollbar{display:none}
.badge{flex-shrink:0;width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.4;filter:grayscale(1)}
.badge.earned{opacity:1;filter:none}
.badge-ico{width:50px;height:50px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-size:23px}
.badge.earned .badge-ico{background:linear-gradient(150deg,rgba(0,86,210,.14),#fff);border-color:rgba(0,86,210,.3);box-shadow:0 6px 16px -6px rgba(0,86,210,.35)}
.badge span{font-size:9.5px;text-align:center;color:var(--muted);font-weight:600;line-height:1.25}
.badge.earned span{color:var(--b700)}
.list{background:rgba(15,23,42,.03);border:1px solid var(--line-2);border-radius:16px;overflow:hidden;margin-bottom:18px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);font-size:13px}
.lrow:last-child{border-bottom:none}
.lrow .k{color:var(--muted-2);font-weight:600;font-size:12.5px}
.lrow .v{font-weight:600;text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis}
.btn-logout{background:rgba(0,44,107,.08);color:var(--b700);border:1px solid rgba(0,44,107,.2)}

.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:13px}
.skel{background:linear-gradient(90deg,var(--bg-3),#f6f8fc,var(--bg-3));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:300;background:rgba(11,25,50,.42);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:0;opacity:0;visibility:hidden;transition:.3s var(--ease)}
.overlay.show{opacity:1;visibility:visible}
.sheet{width:100%;max-width:480px;background:#fff;border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .35s var(--ease)}
.overlay.show .sheet{transform:none}
.sheet h3{font-size:18px;margin-bottom:4px}
.sheet p{font-size:13px;color:var(--muted);margin-bottom:16px}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line-2);margin:-8px auto 16px}
.inp{width:100%;border:1.5px solid var(--line-2);border-radius:12px;padding:12px 14px;margin-bottom:10px;outline:none;font-size:14px;background:#fff;resize:vertical}
.inp:focus{border-color:var(--b500)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-160%);width:calc(100% - 32px);max-width:440px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 16px 40px -12px rgba(0,0,0,.25);z-index:400;transition:transform .5s var(--ease),visibility .5s;visibility:hidden}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.toast-ico{font-size:22px}
.toast-title{font-size:13.5px;font-weight:700}
.toast-sub{font-size:11.5px;color:var(--muted)}

/* ---------- Bottom nav ---------- */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line-2);padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.nav-inner{display:flex;width:100%;position:relative}
.nav-ind{position:absolute;top:0;height:100%;background:rgba(0,86,210,.12);border-radius:12px;transition:transform .35s var(--ease),width .35s var(--ease);z-index:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted-2);padding:8px 0;position:relative;z-index:1;transition:.2s var(--ease)}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.25s var(--ease)}
.nav-btn span{font-size:10px;font-weight:600}
.nav-btn.active{color:var(--b600)}
.nav-btn.active svg{transform:translateY(-2px)}
.side{display:none}

/* ---------- Wide screens: sidebar + roomier grid ---------- */
@media (min-width:960px){
  body{background:var(--bg-2)}
  .app{max-width:none;margin:0;padding-left:250px}
  .blob{display:none}
  .bottom-nav{display:none}
  .side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:250px;background:#fff;border-right:1px solid var(--line-2);padding:22px 16px;z-index:20}
  .side-logo img{height:28px;margin:4px 10px 26px}
  .side-link{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;color:var(--silver);margin-bottom:4px;transition:.15s}
  .side-link svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .side-link:hover{background:var(--bg-2)}
  .side-link.active{background:rgba(0,86,210,.1);color:var(--b600)}
  .side-promo{margin-top:auto;border-radius:18px;padding:16px;color:#fff;background:linear-gradient(135deg,var(--o600),var(--o400));position:relative;overflow:hidden}
  .side-promo::after{content:'';position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.15)}
  .side-promo b{display:block;font-size:14.5px;margin-bottom:4px}
  .side-promo p{font-size:12px;opacity:.92;margin-bottom:12px}
  .side-promo a{display:inline-block;background:#fff;color:var(--o600);font-weight:800;font-size:12px;padding:7px 14px;border-radius:99px}
  .top,main{max-width:1040px;margin:0 auto}
  .top{padding:30px 36px 6px}
  main{padding:18px 36px 60px}
  .glass,.stat,.mod-card,.cc,.dm,.thread-card,.job,.list,.op,.buybox{background:#fff}
  .course-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
  .cthumb{height:110px}
  .home-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:start}
  .detail-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
  .detail-grid .buybox{position:sticky;top:20px}
  .banner{height:200px}
  .lesson-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
  .h-scroll{margin:0;padding:0 0 4px}
  .h-scroll .cc{flex-basis:200px}
  .narrow{max-width:760px}
  .overlay{align-items:center}
  .sheet{border-radius:22px}
}
</style>
</head>
<body>
<div class="blob blob1"></div><div class="blob blob2"></div>

<aside class="side" id="side">
  <a href="#home" class="side-logo"><img src="/assets/logo-wordmark.png" alt="Upskill10x"></a>
  <nav id="sideNav"></nav>
  <div class="side-promo" id="sidePromo" hidden></div>
</aside>

<div class="app">
  <header class="top">
    <div class="hi"><span class="hi-eyebrow" id="hdrEyebrow">Welcome back</span><b id="hdrTitle">&nbsp;</b></div>
    <div class="top-right">
      <div class="streak-chip cold" id="streakChip" title="Day streak">🔥 0</div>
      <a href="#account" class="av" id="hdrAv">·</a>
    </div>
  </header>
  <main id="view"><div class="skel" style="height:180px"></div><div class="skel" style="height:140px"></div></main>
</div>

<nav class="bottom-nav">
  <div class="nav-inner" id="navInner"><div class="nav-ind" id="navInd"></div></div>
</nav>

<div class="overlay" id="askOverlay">
  <form class="sheet" id="askForm">
    <div class="grab"></div>
    <h3>Ask the community</h3>
    <p>Get help from other learners and the Upskill10x team.</p>
    <input class="inp" id="askTitle" placeholder="Your question in one line" maxlength="160" required>
    <textarea class="inp" id="askBody" rows="4" placeholder="Add details — what did you try?" required></textarea>
    <div class="row-btns"><button type="button" class="btn btn-ghost" id="askCancel">Cancel</button><button class="btn btn-primary" type="submit">Post question</button></div>
  </form>
</div>

<div class="toast" id="toast"><div class="toast-ico"></div><div><div class="toast-title"></div><div class="toast-sub"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script src="/assets/site.js"></script>
<script>
/* =====================================================================
   App state + routing (hash based: #home, #courses, #course/<slug>,
   #lesson/<id>, #community, #thread/<id>, #jobs, #account)
===================================================================== */
const { esc, rupees, duration, clock, offPct, initials } = U;
const view = document.getElementById('view');
let OV = null;               // /lms/overview payload
let destroyPlayer = null;    // current HLS player
let wmTimer = null;

const TABS = [
  { id: 'home', label: 'Home', icon: '<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/>' },
  { id: 'courses', label: 'Courses', icon: '<path d="M4 19.5V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-1.5Z"/>' },
  { id: 'community', label: 'Community', icon: '<circle cx="9" cy="7" r="4"/><path d="M2 21c0-4 3.6-7 7-7s7 3 7 7"/><path d="M16 3.5a4 4 0 0 1 0 7M22 21c0-3-2-5.5-4.5-6.5"/>' },
  { id: 'jobs', label: 'Jobs', icon: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>' },
  { id: 'account', label: 'Account', icon: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>' }
];
const TAB_OF = { home: 'home', courses: 'courses', course: 'courses', lesson: 'courses', community: 'community', thread: 'community', jobs: 'jobs', account: 'account' };
const I = {
  back: '<svg class="icon" viewBox="0 0 24 24"><path d="M19 12H5m0 0 7 7m-7-7 7-7"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7L8 5Z" fill="currentColor"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  arrow: '<svg class="icon go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'
};

/* ---------- API ---------- */
async function api(path, opts) {
  try { return await U.api(path, opts); }
  catch (e) {
    if (e.status === 401) { location.href = '/auth'; throw e; }
    throw e;
  }
}

/* ---------- Toast ---------- */
let toastT = null;
function toast(icon, title, sub = '') {
  const t = document.getElementById('toast');
  t.querySelector('.toast-ico').textContent = icon;
  t.querySelector('.toast-title').textContent = title;
  t.querySelector('.toast-sub').textContent = sub;
  t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3600);
}

/* ---------- Navigation chrome ---------- */
const navInner = document.getElementById('navInner');
navInner.insertAdjacentHTML('beforeend', TABS.map(t => `<a class="nav-btn" href="#${t.id}" data-tab="${t.id}"><svg viewBox="0 0 24 24">${t.icon}</svg><span>${t.label}</span></a>`).join(''));
document.getElementById('sideNav').innerHTML = TABS.map(t => `<a class="side-link" href="#${t.id}" data-tab="${t.id}"><svg viewBox="0 0 24 24">${t.icon}</svg>${t.label}</a>`).join('');
const navInd = document.getElementById('navInd');
function setTab(tab) {
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  const btn = navInner.querySelector(`.nav-btn[data-tab="${tab}"]`);
  if (btn) { navInd.style.width = btn.offsetWidth + 'px'; navInd.style.transform = `translateX(${btn.offsetLeft}px)`; }
}
window.addEventListener('resize', () => setTab(TAB_OF[(location.hash.slice(1) || 'home').split('/')[0]] || 'home'));

function header(eyebrow, title) {
  document.getElementById('hdrEyebrow').textContent = eyebrow;
  document.getElementById('hdrTitle').textContent = title;
}

function paintChrome() {
  if (!OV) return;
  const first = (OV.user.name || '').split(' ')[0] || 'there';
  const s = OV.stats.streak;
  const chip = document.getElementById('streakChip');
  chip.textContent = '🔥 ' + s;
  chip.classList.toggle('cold', !s);
  chip.title = s ? `${s}-day learning streak` : 'Finish a lesson today to start a streak';
  document.getElementById('hdrAv').textContent = initials(OV.user.name);
  const sp = document.getElementById('sidePromo');
  if (!OV.all_access) {
    sp.hidden = false;
    sp.innerHTML = `<b>${esc(OV.bundle.title)}</b><p>All ${OV.courses.length} courses for ${rupees(OV.bundle.price)}.</p><a href="/pay?item=bundle">Get it</a>`;
  } else sp.hidden = true;
  return first;
}

async function loadOverview() {
  OV = await api('/lms/overview');
  paintChrome();
  return OV;
}

/* ---------- Router ---------- */
async function route() {
  if (destroyPlayer) { destroyPlayer(); destroyPlayer = null; }
  clearInterval(wmTimer);
  const [name, arg] = (location.hash.slice(1) || 'home').split('/');
  const tab = TAB_OF[name] || 'home';
  setTab(tab);
  window.scrollTo(0, 0);
  view.classList.remove('view-enter'); void view.offsetWidth; view.classList.add('view-enter');
  try {
    if (!OV) await loadOverview();
    if (name === 'course') return await renderCourse(decodeURIComponent(arg));
    if (name === 'lesson') return await renderLesson(arg);
    if (name === 'courses') return renderCourses();
    if (name === 'community') return await renderCommunity();
    if (name === 'thread') return await renderThread(arg);
    if (name === 'jobs') return await renderJobs();
    if (name === 'account') return await renderAccount();
    return renderHome();
  } catch (e) {
    if (e.status === 401) return;
    view.innerHTML = `<div class="empty">${esc(e.message)}<br><br><a class="btn btn-ghost btn-sm" href="#home">Go home</a></div>`;
  }
}
window.addEventListener('hashchange', route);

/* ---------- Shared bits ---------- */
function cthumb(c) {
  if (c.thumbnail_url) return `<div class="cthumb"><img src="${esc(c.thumbnail_url)}" alt="" loading="lazy">${c.category ? `<span class="ctag">${esc(c.category)}</span>` : ''}${c.owned ? `<span class="cowned">${I.check}</span>` : ''}</div>`;
  return `<div class="cthumb" style="background:${U.gradient(c)}"><span class="o1"></span>${c.category ? `<span class="ctag">${esc(c.category)}</span>` : ''}${c.owned ? `<span class="cowned">${I.check}</span>` : ''}<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">${U.iconFor(c)}</svg></div>`;
}
function courseCard(c, i = 0) {
  const foot = c.owned
    ? `<div class="cprog"><div class="track"><span data-w="${c.progress ? c.progress.pct : 0}"></span></div><span class="pct">${c.progress ? c.progress.pct : 0}%</span></div>`
    : `<div class="cprice"><b>${rupees(c.price)}</b>${c.mrp ? `<s>${rupees(c.mrp)}</s>` : ''}</div>`;
  return `<a class="cc" href="#course/${esc(c.slug)}" style="animation-delay:${i * .04}s">${cthumb(c)}
    <div class="cbody"><h4>${esc(c.title)}</h4><p class="cmeta">${c.module_count} modules · ${c.lesson_count} lessons${c.total_secs ? ' · ' + duration(c.total_secs) : ''}</p><div class="cfoot">${foot}</div></div></a>`;
}
function animateBars(scope) {
  requestAnimationFrame(() => scope.querySelectorAll('[data-w]').forEach(s => { s.style.width = s.dataset.w + '%'; }));
}
function ringSVG(size, stroke, pct, color) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle class="bg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}"/><circle class="fg" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" ${color ? `style="stroke:${color}"` : ''} stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}" data-off="${(c * (1 - Math.min(pct, 100) / 100)).toFixed(1)}"/></svg>`;
}
function animateRings(scope) {
  requestAnimationFrame(() => requestAnimationFrame(() => scope.querySelectorAll('.ring .fg[data-off]').forEach(f => f.setAttribute('stroke-dashoffset', f.dataset.off))));
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(String(iso).replace(' ', 'T') + (String(iso).includes('Z') || String(iso).includes('+') ? '' : 'Z'));
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}
function ago(iso) {
  const d = new Date(String(iso).replace(' ', 'T') + (String(iso).includes('Z') ? '' : 'Z'));
  const s = (Date.now() - d) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 86400 * 7) return Math.floor(s / 86400) + 'd ago';
  return fmtDate(iso);
}
const AV_CLASSES = ['', 'o', 't'];
const avClass = (name = '') => AV_CLASSES[[...name].reduce((n, ch) => n + ch.charCodeAt(0), 0) % 3];

/* =====================================================================
   HOME
===================================================================== */
const DAILY_GOAL = 2; // lessons per day

function renderHome() {
  const first = paintChrome();
  header('Welcome back', first);
  const owned = OV.courses.filter(c => c.owned);
  const notOwned = OV.courses.filter(c => !c.owned);
  // Most recently studied course with lessons left, else the first owned one.
  const resume = [...owned].filter(c => c.next_video).sort((a, b) => String(b.last_activity || '').localeCompare(String(a.last_activity || '')))[0];
  // Overall progress counts the courses you've actually started (an All-Access
  // member shouldn't see 5% just because they own everything).
  const started = owned.filter(c => c.progress && c.progress.done);
  const basis = started.length ? started : owned;
  const totalDone = basis.reduce((n, c) => n + (c.progress ? c.progress.done : 0), 0);
  const totalAll = basis.reduce((n, c) => n + (c.progress ? c.progress.total : 0), 0);
  const myList = [...owned].sort((a, b) => (b.progress ? b.progress.done : 0) - (a.progress ? a.progress.done : 0) || String(b.last_activity || '').localeCompare(String(a.last_activity || ''))).slice(0, 2);
  const pct = totalAll ? Math.round(totalDone / totalAll * 100) : 0;
  const today = OV.stats.lessons_today;

  let hero;
  if (resume) {
    const p = resume.progress;
    hero = `<div class="glass">
      <span class="chip">Continue learning</span>
      <h2>${esc(resume.title)}</h2>
      <p class="s">Lesson ${p.done + 1} · ${esc(resume.next_video.title)}</p>

  } else {
    hero = `<div class="glass"><span class="chip">Get started</span><h2>Pick your first course</h2>
      <p class="s">Watch free previews, then buy a single course or unlock everything with ${esc(OV.bundle.title)}.</p>
      <div class="row-btns"><a class="btn btn-ghost" href="#courses">Browse</a><a class="btn btn-accent" href="/pay?item=bundle">Get All-Access</a></div></div>`;
  }

  const slides = [];
  if (!OV.all_access) slides.push({ cls: 'p-orange', tag: 'Best value', title: `${OV.bundle.title} — ${rupees(OV.bundle.price)}`, text: `All ${OV.courses.length} courses + every new one. ${OV.bundle.mrp ? 'Was ' + rupees(OV.bundle.mrp) + '.' : ''}`, cta: 'Get All-Access', href: '/pay?item=bundle' });
  const promoCls = ['p-blue', 'p-navy', 'p-mix', 'p-blue', 'p-navy'];
  notOwned.slice(0, 5).forEach((c, i) => slides.push({ cls: promoCls[i], tag: c.category || 'Course', title: c.title, text: c.subtitle || '', cta: `View · ${rupees(c.price)}`, href: '#course/' + c.slug }));
  if (OV.all_access) owned.filter(c => c.progress && !c.progress.done).slice(0, 4).forEach((c, i) => slides.push({ cls: promoCls[i], tag: 'Included', title: c.title, text: c.subtitle || '', cta: 'Start course', href: '#course/' + c.slug }));

  const promo = slides.length ? `<div class="promo"><div class="promo-track" id="promoTrack">${slides.map(s => `
      <a class="promo-slide ${s.cls}" href="${esc(s.href)}"><div><span class="promo-tag">${esc(s.tag)}</span><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div><span class="promo-cta">${esc(s.cta)}</span></a>`).join('')}
    </div><div class="promo-dots" id="promoDots">${slides.map((_, i) => `<span class="promo-dot ${i ? '' : 'active'}"></span>`).join('')}</div></div>` : '';

  const goalPct = Math.min(100, today / DAILY_GOAL * 100);
  const goal = `<div class="glass plain" style="animation-delay:.04s"><div class="goal-row">${ringSVG(60, 6, goalPct)}
      <div><div class="goal-label">Today's goal</div><div class="goal-value">${today} <span>/ ${DAILY_GOAL} lessons</span></div>
      <div class="goal-sub">${today >= DAILY_GOAL ? 'Goal met — nice work! 🎯' : OV.stats.streak ? `${DAILY_GOAL - today} more to keep your ${OV.stats.streak}-day streak growing` : 'Finish a lesson to start a streak'}</div></div></div></div>`;

  const jump = owned.length ? `<div class="sec-title">Your courses <a href="#courses">See all</a></div>` + myList.map((c, i) => `
      <a class="mod-card" href="#course/${esc(c.slug)}" style="animation-delay:${i * .05}s">${ringSVG(38, 4, c.progress ? c.progress.pct : 0, 'var(--b400)')}
      <div><h4>${esc(c.title)}</h4><p>${c.progress && c.progress.done ? `${c.progress.pct}% · ${c.progress.done}/${c.progress.total} lessons` : 'Not started'}</p></div>${I.arrow}</a>`).join('') : '';

  const rec = notOwned.length ? `<div class="sec-title">Recommended for you <a href="#courses">Browse</a></div><div class="h-scroll">${notOwned.map(courseCard).join('')}</div>` : '';

  const statsBlock = owned.length ? `<div class="stat-row"><div class="stat"><div class="n">${pct}%</div><div class="l">Progress</div></div><div class="stat"><div class="n">${OV.stats.lessons_done}</div><div class="l">Lessons done</div></div><div class="stat"><div class="n">${OV.all_access ? 'All' : owned.length}</div><div class="l">Courses</div></div></div>${goal}` : '';
  view.innerHTML = `<div class="home-grid"><div>${hero}${promo}</div><div>${statsBlock}${jump}${owned.length ? '' : rec}</div></div>${owned.length ? rec : ''}`;
  animateBars(view); animateRings(view);
  initPromo();
}

function initPromo() {
  const track = document.getElementById('promoTrack');
  if (!track) return;
  const dots = [...document.querySelectorAll('#promoDots .promo-dot')];
  const n = dots.length; let idx = 0, timer = null;
  const go = i => { idx = (i + n) % n; track.scrollTo({ left: idx * (track.clientWidth + 10), behavior: 'smooth' }); };
  track.addEventListener('scroll', () => { const cur = Math.round(track.scrollLeft / (track.clientWidth + 10)); dots.forEach((d, i) => d.classList.toggle('active', i === cur)); idx = cur; }, { passive: true });
  const start = () => { stop(); if (n > 1) timer = setInterval(() => { if (!document.body.contains(track)) return stop(); go(idx + 1); }, 4500); };
  const stop = () => { clearInterval(timer); timer = null; };
  track.addEventListener('touchstart', stop, { passive: true }); track.addEventListener('touchend', start, { passive: true });
  track.addEventListener('mouseenter', stop); track.addEventListener('mouseleave', start);
  start();
}

async function renderLesson(id) {
  header('Lesson', '');
  view.innerHTML = '<div class="skel" style="aspect-ratio:16/9"></div><div class="skel" style="height:80px"></div>';
  let v;
  try { v = await api('/lms/videos/' + id); }
  catch (e) {
    if (e.status === 403) {
      toast('🔒', e.data && e.data.needsPurchase ? 'Buy this course to watch' : 'Lesson locked', e.message);
      if (e.data && e.data.course_id) { location.replace('#course/' + e.data.course_id); return; }
    }
    throw e;
  }
  const d = v.course ? await api('/lms/courses/' + v.course.id) : null;
  header('Now learning', v.course ? v.course.title : v.title);
  const mod = d ? d.modules.find(m => m.videos.some(x => x.id === v.id)) : null;
  const me = mod ? mod.videos.find(x => x.id === v.id) : null;
  const isDone = !!(me && me.completed);
  const nextPlayable = v.next && d ? d.modules.flatMap(m => m.videos).find(x => x.id === v.next.id) : null;

  view.innerHTML = `<a class="back" href="#course/${v.course ? esc(v.course.slug) : ''}">${I.back}${v.course ? esc(v.course.title) : 'Back'}</a>
    <div class="lesson-grid"><div>
      <div class="player-wrap" id="pw">${v.hls_url ? `<video id="player" controls playsinline controlsList="nodownload" disablePictureInPicture oncontextmenu="return false"></video><div class="wm" id="wm">${esc(OV.user.email)}</div>` : '<div class="player-empty">This video is being uploaded. Check back soon.</div>'}</div>
      <h1 class="l-title">${esc(v.title)}</h1>
      <div class="l-sub">${esc(v.module_title)} · Lesson ${v.position} of ${v.total}${v.is_preview && !(d && d.owned) ? ' · Free preview' : ''}</div>
      ${v.description ? `<p class="l-desc">${esc(v.description)}</p>` : ''}
      <div class="row-btns" id="lessonActions">
        ${d && d.owned ? (isDone ? `<span class="done-pill">${I.check.replace('<svg', '<svg width="14" height="14"')} Completed</span>` : `<button class="btn btn-ghost" id="markDone">Mark as complete</button>`) : ''}
        ${v.next ? `<button class="btn btn-primary" id="nextBtn">Next lesson →</button>` : ''}
      </div>
      ${d && !d.owned ? `<div class="buybox" style="margin-top:16px"><div style="font-size:13px;font-weight:700;margin-bottom:10px">Enjoying the preview? Unlock all ${d.progress.total} lessons.</div>
        <div class="row-btns"><a class="btn btn-primary" href="/pay?item=course&course=${encodeURIComponent(d.course.slug)}">Buy · ${rupees(d.course.price)}</a>${d.course_count > 1 ? `<a class="btn btn-accent" href="/pay?item=bundle">All courses · ${rupees(d.bundle.price)}</a>` : ''}</div></div>` : ''}
    </div>
    <div>${mod ? `<div class="sec-title" style="margin-top:18px">${esc(mod.title)}</div>${mod.videos.map(x => `
      <div class="vr ${x.completed ? 'done' : x.playable ? '' : 'locked'} ${x.id === v.id ? 'current' : ''}" data-v="${x.id}" data-playable="${x.playable ? 1 : 0}"><div class="vp">${x.completed ? I.check : x.playable ? I.play : I.lock}</div><span class="vt">${esc(x.title)}</span><span class="vd">${clock(x.duration_secs)}</span></div>`).join('')}` : ''}</div></div>`;

  view.querySelectorAll('.vr').forEach(r => r.addEventListener('click', () => {
    if (r.dataset.playable === '1') location.hash = 'lesson/' + r.dataset.v; else toast('🔒', 'Locked', 'Finish the earlier lessons first.');
  }));

  async function complete(auto) {
    if (!d || !d.owned || isDoneNow) return;
    isDoneNow = true;
    try {
      await api(`/lms/videos/${v.id}/complete`, { method: 'POST' });
      await loadOverview();
      const md = document.getElementById('markDone');
      if (md) md.outerHTML = `<span class="done-pill">${I.check.replace('<svg', '<svg width="14" height="14"')} Completed</span>`;
      const cur = view.querySelector('.vr.current');
      if (cur) { cur.classList.add('done'); cur.querySelector('.vp').innerHTML = I.check; }
      toast('✅', auto ? 'Lesson complete!' : 'Marked complete', OV.stats.streak > 1 ? `${OV.stats.streak}-day streak 🔥` : 'Keep going!');
    } catch (e) { isDoneNow = false; toast('⚠️', 'Could not save progress', e.message); }
  }
  let isDoneNow = isDone;
  const md = document.getElementById('markDone');
  if (md) md.addEventListener('click', () => complete(false));
  const nb = document.getElementById('nextBtn');
  if (nb) nb.addEventListener('click', async () => {
    // Moving on counts as finishing this lesson; the next may only unlock after that.
    if (d && d.owned && !isDoneNow) await complete(false);
    location.hash = 'lesson/' + v.next.id;
  });
  if (nextPlayable && !nextPlayable.playable && nb && !(d && d.owned)) nb.remove();

  const player = document.getElementById('player');
  if (player) {
    destroyPlayer = U.playHls(player, v.hls_url);
    player.addEventListener('ended', () => complete(true));
    // Moving watermark with the viewer's email (discourages screen recording).
    const wm = document.getElementById('wm');
    const moveWm = () => { wm.style.top = (8 + Math.random() * 74) + '%'; wm.style.left = (4 + Math.random() * 60) + '%'; };
    moveWm(); wmTimer = setInterval(moveWm, 7000);
  }
}

    <div class="cmt-count">${posts.length} repl${posts.length === 1 ? 'y' : 'ies'}</div>
    ${posts.map(p => `<div class="cmt"><div class="avatar ${avClass(p.author_name)}">${initials(p.author_name)}</div><div class="cmt-body"><div class="cn">${esc(p.author_name)}</div><div class="ct">${esc(p.body)}</div><div class="cd">${ago(p.created_at)}</div></div></div>`).join('') || '<div class="empty" style="padding:14px">No replies yet — help out!</div>'}
    <form class="reply-box" id="replyForm"><textarea id="replyBody" rows="1" placeholder="Write a reply…"></textarea><button class="btn btn-primary btn-sm" type="submit">Reply</button></form></div>`;
  const ta = document.getElementById('replyBody');
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
  ta.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') document.getElementById('replyForm').requestSubmit(); });
  document.getElementById('replyForm').addEventListener('submit', async e => {
    e.preventDefault();
    const body = ta.value.trim(); if (!body) return;
    try { await api(`/lms/community/threads/${id}/reply`, { method: 'POST', body: JSON.stringify({ body }) }); renderThread(id); }
    catch (err) { toast('⚠️', 'Could not reply', err.message); }
  });
}

function longestStreak(activity) {
  const days = activity.map(a => a.date).sort();
  let best = 0, cur = 0, prev = null;
  days.forEach(d => {
    const t = Date.parse(d + 'T00:00:00Z');
    cur = prev !== null && t - prev === 86400000 ? cur + 1 : 1;
    best = Math.max(best, cur); prev = t;
  });
  return best;
}

// GitHub-style grid: 20 week-columns × 7 days, ending today.
function heatmap(activity, today) {
  const counts = new Map(activity.map(a => [a.date, a.count]));
  const end = new Date(today + 'T00:00:00Z');
  const weeks = 20;
  // Align so the last column ends on today's weekday (Sun-first rows).
  const first = new Date(end); first.setUTCDate(end.getUTCDate() - end.getUTCDay() - (weeks - 1) * 7);
  const cells = [], months = [];
  let lastMonth = -1;
  for (let w = 0; w < weeks; w++) {
    const colDate = new Date(first); colDate.setUTCDate(first.getUTCDate() + w * 7);
    const m = colDate.getUTCMonth();
    months.push(m !== lastMonth ? colDate.toLocaleString('en-IN', { month: 'short', timeZone: 'UTC' }) : '');
    lastMonth = m;
    for (let d = 0; d < 7; d++) {
      const day = new Date(first); day.setUTCDate(first.getUTCDate() + w * 7 + d);
      const key = day.toISOString().slice(0, 10);
      if (day > end) { cells.push('<div class="hc future"></div>'); continue; }
      const n = counts.get(key) || 0;
      const lvl = n === 0 ? 0 : n === 1 ? 1 : n <= 2 ? 2 : n <= 4 ? 3 : 4;
      const bg = ['var(--line-2)', 'rgba(0,86,210,.3)', 'rgba(0,86,210,.55)', 'rgba(0,86,210,.8)', 'var(--b700)'][lvl];
      cells.push(`<div class="hc" title="${key}: ${n} lesson${n === 1 ? '' : 's'}" style="background:${bg};animation-delay:${(w * 7 + d) * .006}s"></div>`);
    }
  }
  return `<div class="heat-months" style="display:grid;grid-template-columns:repeat(${weeks},1fr);gap:3px">${months.map(m => `<span style="white-space:nowrap">${m}</span>`).join('')}</div>
    <div class="heat-grid" style="grid-template-columns:repeat(${weeks},1fr)">${cells.join('')}</div>
    <div class="heat-legend">Less <i style="background:var(--line-2)"></i><i style="background:rgba(0,86,210,.3)"></i><i style="background:rgba(0,86,210,.55)"></i><i style="background:rgba(0,86,210,.8)"></i><i style="background:var(--b700)"></i> More</div>`;
}
