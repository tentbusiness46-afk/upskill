<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All courses — Upskill10x</title>
<meta name="description" content="Browse every Upskill10x course: SEO, Meta Ads, video editing, graphic design, website & app development, Excel and Power BI.">
<meta name="theme-color" content="#0056d2">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
.catalog{padding:36px 0 70px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.bar .count{color:var(--muted);font-size:14px;font-weight:600}
.bar .chip-row{margin:0}
.aa-banner{margin-top:48px;border-radius:22px;background:linear-gradient(120deg,var(--orange-600),var(--orange-400));color:#fff;padding:26px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:relative;overflow:hidden}
.aa-banner::after{content:'';position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.14)}
.aa-banner div{flex:1;min-width:240px;position:relative;z-index:1}
.aa-banner h2{font-size:22px;margin-bottom:4px}
.aa-banner p{opacity:.92}
.aa-banner .btn{background:#fff;color:var(--orange-600);position:relative;z-index:1}
@media (max-width:600px){ body{padding-bottom:70px} }
</style>
</head>
<body>
<div id="chrome-top"></div>

<main>
  <div class="page-band">
    <div class="wrap">
      <h1>All courses</h1>
      <p>Practical, project-based courses with lifetime access. Watch the free previews, then buy one course — or get every course with the All-Access Pass.</p>
      <form class="search" id="bandSearch" role="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input type="search" id="bandQ" placeholder="Search courses, e.g. SEO, Excel, app" aria-label="Search courses"></form>
    </div>
  </div>

  <section class="catalog">
    <div class="wrap">
      <div class="bar"><div class="chip-row" id="catChips"></div><span class="count" id="count"></span></div>
      <div class="course-grid" id="courseGrid">
        <div class="skeleton" style="height:280px"></div><div class="skeleton" style="height:280px"></div><div class="skeleton" style="height:280px"></div><div class="skeleton" style="height:280px"></div>
      </div>
      <div class="aa-banner" id="aaBanner" hidden>
        <div><h2 id="aaTitle"></h2><p id="aaText"></p></div>
        <a href="/pricing" class="btn btn-lg">Compare plans</a>
      </div>
    </div>
  </section>
</main>

<div id="chrome-footer"></div>

<div class="buy-bar" id="buyBar">
  <div class="wrap">
    <div class="bb-text"><span id="bbLabel"></span><div class="bb-price" id="bbPrice"></div></div>
    <a href="/pay?item=bundle" class="btn btn-yellow">Buy now</a>
  </div>
</div>

<script src="/assets/site.js"></script>
<script src="/assets/chrome.js"></script>
<script>
const { esc, rupees, thumb, duration, offPct } = U;
let allCourses = [], activeCat = 'All', query = new URLSearchParams(location.search).get('q') || '';
const bandQ = document.getElementById('bandQ');
bandQ.value = query;

function courseCard(c) {
  const off = offPct(c.price, c.mrp);
  return `
    <a class="c-card reveal" href="/course/${esc(c.slug)}">
      <div class="thumb">${thumb(c)}</div>
      <h3>${esc(c.title)}</h3>
      <p class="sub">${esc(c.subtitle || '')}</p>
      <div class="c-meta">
        <span><svg class="icon" viewBox="0 0 24 24"><path d="m10 8 6 4-6 4V8Z"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>${c.lesson_count} lessons</span>
        ${c.total_secs ? `<span><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>${duration(c.total_secs)}</span>` : ''}
        <span>${esc(c.level || 'Beginner')}</span>
      </div>
      <div class="price-row"><span class="price">${rupees(c.price)}</span>${c.mrp ? `<span class="mrp">${rupees(c.mrp)}</span>` : ''}${off ? `<span class="off">${off}% off</span>` : ''}</div>
    </a>`;
}
function renderGrid() {
  const q = query.toLowerCase();
  const list = allCourses.filter(c =>
    (activeCat === 'All' || (c.category || 'Other') === activeCat) &&
    (!q || [c.title, c.subtitle, c.category, c.description].join(' ').toLowerCase().includes(q)));
  const grid = document.getElementById('courseGrid');
  document.getElementById('count').textContent = `${list.length} course${list.length === 1 ? '' : 's'}`;
  grid.innerHTML = list.length ? list.map(courseCard).join('')
    : `<div class="empty" style="grid-column:1/-1">No courses match “${esc(query)}”. <button class="btn-link" id="clearSearch">Show all courses</button></div>`;
  const clr = document.getElementById('clearSearch');
  if (clr) clr.addEventListener('click', () => { query = ''; bandQ.value = ''; activeCat = 'All'; renderChips(); renderGrid(); });
  observeReveal(grid);
}
function renderChips() {
  const cats = ['All', ...new Set(allCourses.map(c => c.category || 'Other'))];
  const el = document.getElementById('catChips');
  el.innerHTML = cats.length > 2 ? cats.map(c => `<button class="chip ${c === activeCat ? 'active' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('') : '';
  el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { activeCat = b.dataset.cat; renderChips(); renderGrid(); }));
}
window.onSiteSearch = (q) => { query = q; bandQ.value = q; activeCat = 'All'; renderChips(); renderGrid(); };
document.getElementById('bandSearch').addEventListener('submit', e => { e.preventDefault(); window.onSiteSearch(bandQ.value.trim()); });
bandQ.addEventListener('input', () => window.onSiteSearch(bandQ.value.trim()));

CATALOG.then(({ courses, bundle }) => {
  allCourses = courses;
  renderChips(); renderGrid();
  if (courses.length > 1) {
    document.getElementById('aaBanner').hidden = false;
    document.getElementById('aaTitle').textContent = `Want more than one skill? Get all ${courses.length} for ${rupees(bundle.price)}`;
    document.getElementById('aaText').textContent = `${bundle.title} — ${bundle.tagline}`;
  }
  document.getElementById('bbLabel').innerHTML = `Get <b>all ${courses.length} courses</b> with ${esc(bundle.title)}`;
  document.getElementById('bbPrice').innerHTML = `${rupees(bundle.price)}${bundle.mrp ? `<s>${rupees(bundle.mrp)}</s>` : ''}`;
});
const bar = document.getElementById('buyBar');
addEventListener('scroll', () => bar.classList.toggle('show', scrollY > 500), { passive: true });
</script>
</body>
</html>
